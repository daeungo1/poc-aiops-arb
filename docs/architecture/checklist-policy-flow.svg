<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">체크리스트와 정책의 구조 및 판정 흐름</title>
  <desc id="desc">체크리스트 release lifecycle, domain-control-rule 계층, deterministic, evidence-assisted, human-only 판정 경로와 사용자 화면 구성을 표현한다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172b4d" flood-opacity="0.13"/>
    </filter>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker>
    <style>
      text { font-family: Inter, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #52616f; }
      .section { font-size: 20px; font-weight: 800; }
      .card { fill: white; stroke-width: 2.3; rx: 15; filter: url(#shadow); }
      .name { font-size: 21px; font-weight: 800; }
      .body { font-size: 16px; fill: #425466; }
      .small { font-size: 14px; fill: #52616f; }
      .pill { font-size: 14px; font-weight: 800; }
      .text-white { fill: #ffffff; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 3.5; marker-end: url(#blue); }
      .dashed { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 9 6; marker-end: url(#purple); }
    </style>
  </defs>
  <rect width="1800" height="1180" fill="#fff"/>
  <text x="65" y="60" class="title">체크리스트는 문서가 아니라 버전이 고정된 정책 제품이다</text>
  <text x="65" y="94" class="subtitle">작성·검토·배포·판정·예외·평가까지 rule_id@revision과 release hash로 연결한다.</text>

  <!-- Lifecycle -->
  <text x="65" y="145" class="section">A. Checklist release lifecycle</text>
  <g>
    <rect x="65" y="170" width="205" height="76" class="card" stroke="#94a3b8"/>
    <text x="168" y="202" text-anchor="middle" class="name">Draft</text>
    <text x="168" y="226" text-anchor="middle" class="small">작성자 변경 가능</text>
    <rect x="315" y="170" width="205" height="76" class="card" stroke="#0ea5e9"/>
    <text x="418" y="202" text-anchor="middle" class="name">Peer review</text>
    <text x="418" y="226" text-anchor="middle" class="small">정책·증거·테스트 검토</text>
    <rect x="565" y="170" width="205" height="76" class="card" stroke="#7c3aed"/>
    <text x="668" y="202" text-anchor="middle" class="name">Approved</text>
    <text x="668" y="226" text-anchor="middle" class="small">새 revision 봉인</text>
    <rect x="815" y="170" width="205" height="76" class="card" stroke="#16a34a"/>
    <text x="918" y="202" text-anchor="middle" class="name">Effective</text>
    <text x="918" y="226" text-anchor="middle" class="small">release에 pin</text>
    <rect x="1065" y="170" width="205" height="76" class="card" stroke="#f59e0b"/>
    <text x="1168" y="202" text-anchor="middle" class="name">Deprecated</text>
    <text x="1168" y="226" text-anchor="middle" class="small">신규 평가 제외 예정</text>
    <rect x="1315" y="170" width="205" height="76" class="card" stroke="#dc2626"/>
    <text x="1418" y="202" text-anchor="middle" class="name">Revoked</text>
    <text x="1418" y="226" text-anchor="middle" class="small">즉시 사용 중단</text>
    <path d="M270 208 H315 M520 208 H565 M770 208 H815 M1020 208 H1065 M1270 208 H1315" class="arrow"/>
    <rect x="1550" y="170" width="185" height="76" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="1643" y="199" text-anchor="middle" class="pill" fill="#9a3412">수정은 in-place 금지</text>
    <text x="1643" y="224" text-anchor="middle" class="small">새 revision/release 생성</text>
  </g>

  <!-- Structure -->
  <text x="65" y="315" class="section">B. M3 Policy / Checklist Registry 구조</text>
  <rect x="65" y="340" width="430" height="250" class="card" stroke="#7c3aed"/>
  <text x="90" y="380" class="name">Checklist release</text>
  <text x="90" y="414" class="body">
    <tspan x="90" dy="0">ARB Core 4.2.0 · sha256:…</tspan>
    <tspan x="90" dy="29">├─ Domain: Security</tspan>
    <tspan x="90" dy="29">│  └─ Control family: Network</tspan>
    <tspan x="90" dy="29">│     └─ ARB-NET-001@3</tspan>
    <tspan x="90" dy="29">├─ Domain: Reliability</tspan>
    <tspan x="90" dy="29">└─ Domain: Cost / Operations</tspan>
  </text>

  <rect x="535" y="340" width="560" height="250" class="card" stroke="#475569"/>
  <text x="560" y="380" class="name">Rule contract: 판정에 필요한 모든 것</text>
  <text x="560" y="414" class="body">
    <tspan x="560" dy="0">Identity: rule_id · immutable revision · severity</tspan>
    <tspan x="560" dy="29">Scope: resource types · applicability · dependencies</tspan>
    <tspan x="560" dy="29">Assertion: engine · path · operator · expected</tspan>
    <tspan x="560" dy="29">Evidence: required sources · freshness · redaction</tspan>
    <tspan x="560" dy="29">Governance: owner · exception · expiry · controls</tspan>
    <tspan x="560" dy="29">Tests: positive · negative · missing/conflicting evidence</tspan>
  </text>

  <rect x="1135" y="340" width="600" height="250" class="card" stroke="#0891b2"/>
  <text x="1160" y="380" class="name">한 rule의 다차원 constraint</text>
  <text x="1160" y="414" class="body">
    <tspan x="1160" dy="0">resource_type: Microsoft.Storage/storageAccounts</tspan>
    <tspan x="1160" dy="29">entry: properties.publicNetworkAccess 존재</tspan>
    <tspan x="1160" dy="29">value: Disabled 이어야 함</tspan>
    <tspan x="1160" dy="29">entry_dependency: private endpoint evidence 필요</tspan>
    <tspan x="1160" dy="29">value_dependency: firewall/defaultAction 관계 확인</tspan>
    <tspan x="1160" dy="29">cross-reference: Azure Policy · Prowler · OPA ID</tspan>
  </text>

  <!-- Three lanes -->
  <text x="65" y="655" class="section">C. Rule kind별 판정 경로</text>

  <rect x="65" y="685" width="515" height="260" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="90" y="708" width="140" height="32" rx="16" fill="#2563eb"/>
  <text x="160" y="730" text-anchor="middle" class="pill text-white">DETERMINISTIC</text>
  <text x="90" y="775" class="name">기계 증거만으로 판정</text>
  <text x="90" y="811" class="body">
    <tspan x="90" dy="0">M4 snapshot → JSONPath / Azure Policy / OPA</tspan>
    <tspan x="90" dy="28">→ exact assertion → pass/fail/not_applicable</tspan>
    <tspan x="90" dy="28">LLM은 판정을 변경하지 않고 설명만 생성</tspan>
    <tspan x="90" dy="28">Critical false-pass는 Evaluation gate를 즉시 차단</tspan>
  </text>
  <rect x="90" y="900" width="460" height="28" rx="8" fill="#dbeafe"/>
  <text x="320" y="920" text-anchor="middle" class="small">예: PostgreSQL publicNetworkAccess == Disabled</text>

  <rect x="625" y="685" width="515" height="260" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="650" y="708" width="190" height="32" rx="16" fill="#7c3aed"/>
  <text x="745" y="730" text-anchor="middle" class="pill text-white">EVIDENCE-ASSISTED</text>
  <text x="650" y="775" class="name">증거를 먼저 모으고 제한적으로 해석</text>
  <text x="650" y="811" class="body">
    <tspan x="650" dy="0">M4 evidence bundle → contract/freshness 검증</tspan>
    <tspan x="650" dy="28">→ M2/M5가 citation 기반 설명·누락 식별</tspan>
    <tspan x="650" dy="28">→ 증거 충돌/누락이면 manual_review</tspan>
    <tspan x="650" dy="28">LLM judge는 품질 보조 지표이며 verdict 권한 없음</tspan>
  </text>
  <rect x="650" y="900" width="460" height="28" rx="8" fill="#f3e8ff"/>
  <text x="880" y="920" text-anchor="middle" class="small">예: backup 설정 + 복구시험 증빙이 RPO 목표를 충족하는가</text>

  <rect x="1185" y="685" width="550" height="260" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="1210" y="708" width="130" height="32" rx="16" fill="#ea580c"/>
  <text x="1275" y="730" text-anchor="middle" class="pill text-white">HUMAN-ONLY</text>
  <text x="1210" y="775" class="name">책임 있는 사람만 판정</text>
  <text x="1210" y="811" class="body">
    <tspan x="1210" dy="0">시스템은 context와 필요한 질문만 준비</tspan>
    <tspan x="1210" dy="28">→ reviewer가 approve/deny/exception</tspan>
    <tspan x="1210" dy="28">→ scope · expiry · compensating control 기록</tspan>
    <tspan x="1210" dy="28">미검토 상태를 녹색 pass로 표시하지 않음</tspan>
  </text>
  <rect x="1210" y="900" width="495" height="28" rx="8" fill="#ffedd5"/>
  <text x="1458" y="920" text-anchor="middle" class="small">예: 잔여위험 수용, DR 훈련의 계약상 RTO 달성 승인</text>

  <path d="M495 465 H535" class="dashed"/>
  <path d="M1095 465 H1135" class="dashed"/>
  <path d="M280 590 V650 H320 V685" class="arrow"/>
  <path d="M815 590 V650 H880 V685" class="arrow"/>
  <path d="M1435 590 V650 H1460 V685" class="arrow"/>

  <!-- Provenance and UI strips -->
  <rect x="65" y="980" width="1670" height="78" rx="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
  <text x="90" y="1012" class="name">D. Control provenance:</text>
  <text x="315" y="1012" class="body">Internal ARB(최종 권위) ← Azure Well-Architected Framework · Microsoft Cloud Security Benchmark · 서비스별 baseline</text>
  <text x="315" y="1041" class="body">Rule 구현/교차검증: Azure Policy initiative · Prowler · OPA/Conftest · Checkov/Trivy/TFLint — 외부 ID는 ARB rule과 동치가 아니라 mapping이다.</text>

  <rect x="65" y="1080" width="1670" height="60" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="1116" class="name">UI 시각화:</text>
  <text x="230" y="1116" class="body">release 카드(버전·hash·유형별 개수) → Domain/Control/Rule tree → Evidence drawer(원본·정규화·policy·agent citation) → Review/Exception</text>
</svg>
