<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Foundry Hosted Agent 기반 AIOps ARB 목표 아키텍처</title>
  <desc id="desc">M1부터 M9까지 번호를 붙인 제품, 에이전트, 정책, 증거, 평가, Terraform, 데이터, Evaluation, CI/CD 모듈과 런타임 및 피드백 흐름</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172b4d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1677ff"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#15803d"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #52616f; }
      .boundary { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 9 7; rx: 20; }
      .boundary-title { font-size: 18px; font-weight: 700; fill: #475569; }
      .card { fill: white; stroke-width: 2.5; rx: 16; filter: url(#shadow); }
      .id { font-size: 20px; font-weight: 800; fill: white; }
      .name { font-size: 22px; font-weight: 800; }
      .body { font-size: 16px; fill: #425466; }
      .small { font-size: 14px; fill: #52616f; }
      .text-white { fill: #ffffff; }
      .text-blue { fill: #1677ff; }
      .text-purple { fill: #7c3aed; }
      .text-green { fill: #15803d; }
      .text-warning { fill: #9a3412; }
      .flow { fill: none; stroke: #1677ff; stroke-width: 4; marker-end: url(#arrow-blue); }
      .control { fill: none; stroke: #7c3aed; stroke-width: 3.5; stroke-dasharray: 10 7; marker-end: url(#arrow-purple); }
      .feedback { fill: none; stroke: #15803d; stroke-width: 3.5; stroke-dasharray: 3 7; marker-end: url(#arrow-green); }
      .label { font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="#ffffff"/>
  <text x="70" y="62" class="title">Foundry Hosted Agent 기반 AIOps ARB 목표 아키텍처</text>
  <text x="70" y="96" class="subtitle">하나의 제품, 분리된 책임: Agent는 조율하고 정책 엔진이 판정하며 CI/CD만 apply한다.</text>

  <rect x="50" y="125" width="350" height="930" class="boundary"/>
  <text x="72" y="158" class="boundary-title">사용자 경험 및 제품 경계</text>

  <rect x="425" y="125" width="830" height="930" class="boundary"/>
  <text x="447" y="158" class="boundary-title">제품 Control Plane / Private Network</text>

  <rect x="1280" y="125" width="470" height="400" class="boundary" fill="#f5f3ff"/>
  <text x="1302" y="158" class="boundary-title">Microsoft Foundry Project</text>

  <rect x="1280" y="550" width="470" height="505" class="boundary" fill="#f0fdf4"/>
  <text x="1302" y="583" class="boundary-title">Delivery / 운영 경계</text>

  <!-- M1 -->
  <rect x="85" y="205" width="280" height="205" class="card" stroke="#2563eb"/>
  <rect x="105" y="225" width="52" height="36" rx="9" fill="#2563eb"/>
  <text x="131" y="250" text-anchor="middle" class="id">M1</text>
  <text x="175" y="251" class="name">Web / BFF / Auth</text>
  <text x="105" y="292" class="body">
    <tspan x="105" dy="0">Entra SSO · OBO · scope 검증</tspan>
    <tspan x="105" dy="27">체크리스트/결과/승인 UX</tspan>
    <tspan x="105" dy="27">서명된 단기 capability grant</tspan>
    <tspan x="105" dy="27">Gateway route/canary + authz</tspan>
  </text>

  <rect x="85" y="470" width="280" height="185" class="card" stroke="#0f766e"/>
  <text x="105" y="507" class="name">사용자 화면</text>
  <text x="105" y="544" class="body">
    <tspan x="105" dy="0">① Checklist release card</tspan>
    <tspan x="105" dy="27">② Rule tree + type/status</tspan>
    <tspan x="105" dy="27">③ Evidence drawer</tspan>
    <tspan x="105" dy="27">④ Review / exception queue</tspan>
  </text>

  <rect x="85" y="715" width="280" height="210" class="card" stroke="#c2410c"/>
  <text x="105" y="752" class="name">사람 책임</text>
  <text x="105" y="789" class="body">
    <tspan x="105" dy="0">Human-only control 판정</tspan>
    <tspan x="105" dy="27">불충분/충돌 evidence 검토</tspan>
    <tspan x="105" dy="27">Exception + expiry 승인</tspan>
    <tspan x="105" dy="27">High-risk plan semantic review</tspan>
    <tspan x="105" dy="27">Production apply 승인</tspan>
  </text>

  <!-- M3 -->
  <rect x="470" y="205" width="340" height="205" class="card" stroke="#7c3aed"/>
  <rect x="490" y="225" width="52" height="36" rx="9" fill="#7c3aed"/>
  <text x="516" y="250" text-anchor="middle" class="id">M3</text>
  <text x="560" y="251" class="name">Policy / Checklist Registry</text>
  <text x="490" y="292" class="body">
    <tspan x="490" dy="0">rule_id@revision · release hash</tspan>
    <tspan x="490" dy="27">Deterministic / Assisted / Human</tspan>
    <tspan x="490" dy="27">OPA · Prowler · Azure Policy mapping</tspan>
    <tspan x="490" dy="27">Lifecycle · exception · evidence contract</tspan>
  </text>

  <!-- M4 -->
  <rect x="860" y="205" width="340" height="205" class="card" stroke="#0891b2"/>
  <rect x="880" y="225" width="52" height="36" rx="9" fill="#0891b2"/>
  <text x="906" y="250" text-anchor="middle" class="id">M4</text>
  <text x="950" y="251" class="name">Inventory / Evidence</text>
  <text x="880" y="292" class="body">
    <tspan x="880" dy="0">ARG / ARM immutable snapshot</tspan>
    <tspan x="880" dy="27">Policy · Prowler · logs/metrics/traces</tspan>
    <tspan x="880" dy="27">Normalized fact + dependency graph</tspan>
    <tspan x="880" dy="27">source/time/version/hash/redaction</tspan>
  </text>

  <!-- M5 -->
  <rect x="470" y="475" width="340" height="220" class="card" stroke="#dc2626"/>
  <rect x="490" y="495" width="52" height="36" rx="9" fill="#dc2626"/>
  <text x="516" y="520" text-anchor="middle" class="id">M5</text>
  <text x="560" y="521" class="name">Assessment Engine</text>
  <text x="490" y="562" class="body">
    <tspan x="490" dy="0">결정론적 rule execution 우선</tspan>
    <tspan x="490" dy="27">Evidence contract/freshness 검증</tspan>
    <tspan x="490" dy="27">LLM 설명·누락 식별만 허용</tspan>
    <tspan x="490" dy="27">충돌/불충분 → manual_review</tspan>
    <tspan x="490" dy="27">Finding + citation + verdict lineage</tspan>
  </text>

  <!-- M6 -->
  <rect x="860" y="475" width="340" height="220" class="card" stroke="#ea580c"/>
  <rect x="880" y="495" width="52" height="36" rx="9" fill="#ea580c"/>
  <text x="906" y="520" text-anchor="middle" class="id">M6</text>
  <text x="950" y="521" class="name">Remediation / Terraform</text>
  <text x="880" y="562" class="body">
    <tspan x="880" dy="0">Graph + provider schema grounding</tspan>
    <tspan x="880" dy="27">Bounded repair loop + escalation</tspan>
    <tspan x="880" dy="27">fmt/lint/validate/scan/plan</tspan>
    <tspan x="880" dy="27">Semantic plan delta + cost/policy</tspan>
    <tspan x="880" dy="27">Artifact/PR만 생성 · apply 없음</tspan>
  </text>

  <!-- M7 -->
  <rect x="470" y="760" width="730" height="205" class="card" stroke="#475569"/>
  <rect x="490" y="780" width="52" height="36" rx="9" fill="#475569"/>
  <text x="516" y="805" text-anchor="middle" class="id">M7</text>
  <text x="560" y="806" class="name">Artifact / Data Platform</text>
  <text x="490" y="848" class="body">
    <tspan x="490" dy="0">PostgreSQL: run/status/relation/review/audit/release manifest</tspan>
    <tspan x="490" dy="29">Blob: staging → immutable records · snapshot · evidence · HCL · plan · SARIF</tspan>
    <tspan x="490" dy="29">모든 입력과 결과를 content digest로 연결 · versioning/WORM/lifecycle</tspan>
    <tspan x="490" dy="29">Agent conversation은 business state의 System of Record가 아님</tspan>
  </text>

  <!-- M2 -->
  <rect x="1325" y="195" width="380" height="235" class="card" stroke="#7c3aed"/>
  <rect x="1345" y="215" width="52" height="36" rx="9" fill="#7c3aed"/>
  <text x="1371" y="240" text-anchor="middle" class="id">M2</text>
  <text x="1415" y="241" class="name">Hosted Agent + Toolbox</text>
  <text x="1345" y="283" class="body">
    <tspan x="1345" dy="0">대화 · 의도 해석 · tool orchestration</tspan>
    <tspan x="1345" dy="27">Read/job-submit coarse-grained tools</tspan>
    <tspan x="1345" dy="27">signed grant 검증 + scoped contract</tspan>
    <tspan x="1345" dy="27">Azure write/RBAC/apply 권한 없음</tspan>
    <tspan x="1345" dy="27">versioned image/prompt/tool policy</tspan>
  </text>

  <!-- M8 -->
  <rect x="1325" y="625" width="380" height="205" class="card" stroke="#15803d"/>
  <rect x="1345" y="645" width="52" height="36" rx="9" fill="#15803d"/>
  <text x="1371" y="670" text-anchor="middle" class="id">M8</text>
  <text x="1415" y="671" class="name">Evaluation / Release Gate</text>
  <text x="1345" y="713" class="body">
    <tspan x="1345" dy="0">Golden · adversarial · regression</tspan>
    <tspan x="1345" dy="27">Deterministic + Foundry + human</tspan>
    <tspan x="1345" dy="27">pass^k · semantic-safe · security</tspan>
    <tspan x="1345" dy="27">Candidate → shadow → canary → prod</tspan>
  </text>

  <!-- M9 -->
  <rect x="1325" y="865" width="380" height="150" class="card" stroke="#b45309"/>
  <rect x="1345" y="885" width="52" height="36" rx="9" fill="#b45309"/>
  <text x="1371" y="910" text-anchor="middle" class="id">M9</text>
  <text x="1415" y="911" class="name">CI/CD Approval &amp; Apply</text>
  <text x="1345" y="953" class="body">
    <tspan x="1345" dy="0">Digest-bound PR · SoD · CODEOWNERS</tspan>
    <tspan x="1345" dy="27">Re-plan invalidation · short-lived identity</tspan>
  </text>

  <!-- Runtime paths -->
  <path d="M365 305 H425 Q445 305 445 285 H470" class="flow"/>
  <text x="382" y="286" class="label text-blue">checklist/release API</text>

  <path d="M365 335 C400 335 395 180 430 180 H1235 C1280 180 1280 285 1325 285" class="flow"/>
  <text x="775" y="174" class="label text-blue">conversation / invocation + grant</text>

  <path d="M1325 335 C1210 400 1240 505 1200 540" class="flow"/>
  <text x="1210" y="430" class="label text-blue">job/tool call</text>

  <path d="M810 310 H860" class="control"/>
  <text x="817" y="292" class="label text-purple">evidence contract</text>

  <path d="M640 410 V475" class="control"/>
  <text x="655" y="449" class="label text-purple">rules</text>

  <path d="M1030 410 C1030 445 820 445 810 520" class="flow"/>
  <text x="845" y="441" class="label text-blue">snapshot + facts</text>

  <path d="M810 585 H860" class="flow"/>
  <text x="815" y="566" class="label text-blue">failed findings</text>

  <path d="M640 695 V760" class="flow"/>
  <path d="M1030 695 V760" class="flow"/>

  <path d="M1200 650 C1260 650 1275 725 1325 725" class="control"/>
  <text x="1214" y="686" class="label text-purple">verification manifest</text>

  <path d="M1515 830 V865" class="flow"/>
  <text x="1530" y="852" class="label text-blue">gate passed</text>

  <path d="M1325 940 C1240 940 1245 640 1200 640" class="feedback"/>
  <text x="1210" y="918" class="label text-green">plan/result/audit</text>

  <path d="M1325 765 C1180 1080 460 1080 365 870" class="feedback"/>
  <text x="720" y="1082" class="label text-green">review · failure · production trace → regression dataset → new candidate</text>

  <!-- Legend -->
  <line x1="70" y1="1115" x2="130" y2="1115" class="flow"/>
  <text x="145" y="1121" class="small">런타임 데이터/작업 흐름</text>
  <line x1="390" y1="1115" x2="450" y2="1115" class="control"/>
  <text x="465" y="1121" class="small">정책·버전·승격 통제</text>
  <line x1="700" y1="1115" x2="760" y2="1115" class="feedback"/>
  <text x="775" y="1121" class="small">관측·실패·학습 피드백</text>
  <rect x="1150" y="1096" width="570" height="38" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="1170" y="1121" class="label text-warning">핵심 안전 경계: M2에는 apply 도구가 없고 M9의 별도 identity만 변경을 수행한다.</text>
</svg>
