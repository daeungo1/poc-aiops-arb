<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1060" width="1680" height="1060"
     font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>AIOps ARB — 애플리케이션 상세 아키텍처</title>
  <desc>클라이언트, 엣지(nginx), API(FastAPI), 도메인(v1 LLM 평가 · v2 결정론 평가 · AG-UI 챗봇), 데이터 계층, 외부 Azure 서비스로 구성된 계층형 상세 뷰</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arwRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1060" fill="#ffffff"/>

  <text x="60" y="52" font-size="27" font-weight="700" fill="#0f172a">AIOps ARB — 애플리케이션 상세 뷰</text>
  <text x="60" y="79" font-size="14" fill="#475569">계층별 모듈 구성 · v1(LLM 평가) / v2(결정론 평가) / 챗봇 도구가 같은 API 표면을 공유한다</text>

  <!-- Band 1: Client -->
  <rect x="60" y="110" width="940" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="78" y="136" font-size="15" font-weight="700" fill="#1d4ed8">클라이언트 — React 18 + Vite 5 SPA (frontend/)</text>

  <rect x="78" y="148" width="292" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="92" y="170" font-size="13" font-weight="600" fill="#1e3a8a">App.tsx — 4개 보드 라우팅</text>
  <text x="92" y="190" font-size="11.5" fill="#1e40af">dashboard · assessments · checklists · terraform</text>

  <rect x="384" y="148" width="292" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="398" y="170" font-size="13" font-weight="600" fill="#1e3a8a">context/ Provider</text>
  <text x="398" y="190" font-size="11.5" fill="#1e40af">AzureSession · AssessmentRun · TerraformRun</text>

  <rect x="690" y="148" width="292" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="704" y="170" font-size="13" font-weight="600" fill="#1e3a8a">ChatSidebar · useAgUiChat</text>
  <text x="704" y="190" font-size="11.5" fill="#1e40af">ag-ui-client · authRest · azureScopeHeaders</text>

  <!-- Band 2: Edge -->
  <rect x="60" y="252" width="940" height="70" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="78" y="280" font-size="15" font-weight="700" fill="#0f766e">엣지 — nginx 컨테이너 (docker/nginx.conf.template)</text>
  <text x="78" y="304" font-size="12" fill="#115e59">SPA 정적 서빙 + /api/* 리버스 프록시 → 동일 오리진 처리로 CORS 설정 불필요</text>

  <!-- Band 3: API -->
  <rect x="60" y="352" width="940" height="220" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="78" y="378" font-size="15" font-weight="700" fill="#15803d">API — FastAPI · backend/agui_server.py (uvicorn :5100)</text>

  <rect x="78" y="392" width="445" height="72" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="92" y="414" font-size="13" font-weight="600" fill="#14532d">DelegatedUserTokenMiddleware</text>
  <text x="92" y="433" font-size="11.5" fill="#166534">지정 경로만 ARM 쿠키·Bearer → UserOboCredential</text>
  <text x="92" y="451" font-size="11.5" fill="#166534">그 외에는 DefaultAzureCredential (SAMI/UAMI)</text>

  <rect x="537" y="392" width="445" height="72" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="551" y="414" font-size="13" font-weight="600" fill="#14532d">AzureSessionContextMiddleware</text>
  <text x="551" y="433" font-size="11.5" fill="#166534">X-Azure-Tenant-Id · X-Azure-Subscription-Id 검증</text>
  <text x="551" y="451" font-size="11.5" fill="#166534">→ chat/tools/azure_session.py 컨텍스트 주입</text>

  <rect x="78" y="484" width="292" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="92" y="506" font-size="13" font-weight="600" fill="#92400e">/api/* — v1 라우트</text>
  <text x="92" y="525" font-size="11.5" fill="#a16207">auth · azure · dashboard</text>
  <text x="92" y="543" font-size="11.5" fill="#a16207">assessments · checklists · terraform</text>

  <rect x="384" y="484" width="292" height="76" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="398" y="506" font-size="13" font-weight="600" fill="#3730a3">/api/v2/* — enterprise 라우트</text>
  <text x="398" y="525" font-size="11.5" fill="#4338ca">controls · assessments · findings</text>
  <text x="398" y="543" font-size="11.5" fill="#4338ca">ENTERPRISE_ASSESSMENT_ENABLED 게이트</text>

  <rect x="690" y="484" width="292" height="76" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="704" y="506" font-size="13" font-weight="600" fill="#5b21b6">POST /api/chat — AG-UI</text>
  <text x="704" y="525" font-size="11.5" fill="#6d28d9">Microsoft Agent Framework</text>
  <text x="704" y="543" font-size="11.5" fill="#6d28d9">도구 호출로 v1 파이프라인 구동</text>

  <!-- Band 4: Domain -->
  <rect x="60" y="602" width="940" height="228" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="78" y="628" font-size="15" font-weight="700" fill="#334155">도메인 — 평가 파이프라인 · 에이전트 도구</text>
  <text x="982" y="628" font-size="11.5" fill="#b91c1c" text-anchor="end">v2 원칙: 증거 결손·충돌은 fail이 아닌 unknown</text>

  <rect x="78" y="644" width="292" height="172" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="92" y="668" font-size="13" font-weight="700" fill="#92400e">backend/agent/ — v1 LLM 평가</text>
  <text x="92" y="692" font-size="12" font-weight="600" fill="#78350f">azure_resource_reader.py</text>
  <text x="92" y="708" font-size="11" fill="#a16207">Resource Graph 리소스 수집</text>
  <text x="92" y="730" font-size="12" font-weight="600" fill="#78350f">checklist_loader.py</text>
  <text x="92" y="746" font-size="11" fill="#a16207">DB 등록 YAML 로드</text>
  <text x="92" y="768" font-size="12" font-weight="600" fill="#78350f">assessment_engine.py</text>
  <text x="92" y="784" font-size="11" fill="#a16207">Foundry LLM 평가 · 점수 산정</text>
  <text x="92" y="806" font-size="12" font-weight="600" fill="#78350f">report_generator · terraform_generator</text>

  <rect x="384" y="644" width="292" height="172" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="398" y="668" font-size="13" font-weight="700" fill="#3730a3">backend/enterprise/ — v2 결정론 평가</text>
  <text x="398" y="692" font-size="12" font-weight="600" fill="#312e81">registry.py</text>
  <text x="398" y="708" font-size="11" fill="#4338ca">control + source mapping YAML</text>
  <text x="398" y="730" font-size="12" font-weight="600" fill="#312e81">adapters/</text>
  <text x="398" y="746" font-size="11" fill="#4338ca">arm·arg·aprl·policy·defender·advisor</text>
  <text x="398" y="768" font-size="12" font-weight="600" fill="#312e81">evaluator.py</text>
  <text x="398" y="784" font-size="11" fill="#4338ca">6상태 verdict · LLM 미개입</text>
  <text x="398" y="806" font-size="12" font-weight="600" fill="#312e81">service · postgres_repository</text>

  <rect x="690" y="644" width="292" height="172" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="704" y="668" font-size="13" font-weight="700" fill="#5b21b6">backend/chat/ — AG-UI 챗봇</text>
  <text x="704" y="692" font-size="12" font-weight="600" fill="#4c1d95">agent.py</text>
  <text x="704" y="708" font-size="11" fill="#6d28d9">SYSTEM_INSTRUCTIONS · 도구 9종</text>
  <text x="704" y="730" font-size="12" font-weight="600" fill="#4c1d95">tools/assessment.py</text>
  <text x="704" y="746" font-size="11" fill="#6d28d9">run_assessment (checklist_id 필수)</text>
  <text x="704" y="768" font-size="12" font-weight="600" fill="#4c1d95">tools/search · tools/terraform</text>
  <text x="704" y="784" font-size="11" fill="#6d28d9">결과 조회 · HCL 생성·다운로드</text>
  <text x="704" y="806" font-size="12" font-weight="600" fill="#4c1d95">tools/azure_session.py</text>

  <!-- Band 5: Data -->
  <rect x="60" y="860" width="600" height="150" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="78" y="887" font-size="15" font-weight="700" fill="#854d0e">PostgreSQL 16 — backend/scripts/01_schema.sql</text>
  <text x="78" y="909" font-size="11.5" fill="#713f12">기동 시 agent/db_init.py 적용 · DB_HOST 미설정이면 파일 기반 폴백</text>
  <text x="78" y="935" font-size="11.5" font-weight="600" fill="#854d0e">v1</text>
  <text x="110" y="935" font-size="11" fill="#713f12">checklists · checklist_items · result_reports · result_* · terraform_runs</text>
  <text x="78" y="961" font-size="11.5" font-weight="600" fill="#854d0e">v2</text>
  <text x="110" y="961" font-size="11" fill="#713f12">control_definitions · snapshot_runs · evidence_records · enterprise_verdicts</text>
  <text x="78" y="987" font-size="11.5" font-weight="600" fill="#854d0e">개선</text>
  <text x="118" y="987" font-size="11" fill="#713f12">remediation_runs · remediation_artifacts</text>

  <rect x="680" y="860" width="320" height="150" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="698" y="887" font-size="15" font-weight="700" fill="#854d0e">로컬 파일 산출물</text>
  <text x="698" y="911" font-size="11.5" fill="#713f12">results/ — MD · JSON · HTML 리포트</text>
  <text x="698" y="931" font-size="11.5" fill="#713f12">terraform/ — HCL 4종</text>
  <text x="698" y="951" font-size="11.5" fill="#713f12">GET /api/downloads — 정적 서빙</text>
  <text x="698" y="977" font-size="11" fill="#713f12">experiments/coverage_spike/reports/</text>
  <text x="698" y="995" font-size="11" fill="#713f12">current.json (해시 검증 후 읽기)</text>

  <!-- Right column -->
  <rect x="1080" y="110" width="540" height="112" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1098" y="138" font-size="15" font-weight="700" fill="#991b1b">Microsoft Entra ID</text>
  <text x="1098" y="162" font-size="12" fill="#7f1d1d">OAuth2 Authorization Code · MSAL (agent/entra_sso.py)</text>
  <text x="1098" y="184" font-size="12" fill="#7f1d1d">UAMI 페더레이션 client_assertion — 앱 시크릿 없음</text>
  <text x="1098" y="206" font-size="12" fill="#7f1d1d">ARM 사용자 위임 토큰(OBO) 발급 · HttpOnly 쿠키</text>

  <rect x="1080" y="352" width="540" height="112" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="1098" y="380" font-size="15" font-weight="700" fill="#1e293b">Azure 제어 평면</text>
  <text x="1098" y="404" font-size="12" fill="#334155">ARM REST · Azure Resource Graph</text>
  <text x="1098" y="426" font-size="12" fill="#334155">GET /api/azure/subscriptions — OBO ∩ UAMI 교집합</text>
  <text x="1098" y="448" font-size="12" fill="#334155">v1 reader 와 v2 arm/arg adapter 가 공유</text>

  <rect x="1080" y="494" width="540" height="176" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="1098" y="522" font-size="15" font-weight="700" fill="#1e293b">관리형 evidence 원천 (읽기 전용)</text>
  <text x="1098" y="548" font-size="12" fill="#334155">Azure Policy — policy states</text>
  <text x="1098" y="570" font-size="12" fill="#334155">Microsoft Defender for Cloud — assessments</text>
  <text x="1098" y="592" font-size="12" fill="#334155">Azure Advisor — recommendations</text>
  <text x="1098" y="614" font-size="12" fill="#334155">APRL / ARG KQL — query-sha256 로 고정</text>
  <text x="1098" y="642" font-size="11.5" fill="#b91c1c">수집 실패·스로틀링은 CollectionFailure 로 기록되고</text>
  <text x="1098" y="660" font-size="11.5" fill="#b91c1c">해당 control 판정은 unknown 으로 확정된다</text>

  <rect x="1080" y="700" width="540" height="112" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="1098" y="728" font-size="15" font-weight="700" fill="#1e293b">Azure AI Foundry</text>
  <text x="1098" y="752" font-size="12" fill="#334155">AzureOpenAIResponsesClient · 배포 모델 gpt-5.2</text>
  <text x="1098" y="774" font-size="12" fill="#334155">호출 자격 증명은 항상 백엔드 MI (SAMI/UAMI)</text>
  <text x="1098" y="796" font-size="12" fill="#b91c1c">v2 결정론 판정에는 관여하지 않는다</text>

  <rect x="1080" y="860" width="540" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1098" y="886" font-size="14" font-weight="700" fill="#334155">범례</text>
  <rect x="1098" y="898" width="16" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1124" y="911" font-size="12" fill="#334155">클라이언트</text>
  <rect x="1300" y="898" width="16" height="16" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="1326" y="911" font-size="12" fill="#334155">엣지 · nginx</text>
  <rect x="1098" y="924" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1124" y="937" font-size="12" fill="#334155">API · 미들웨어</text>
  <rect x="1300" y="924" width="16" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1326" y="937" font-size="12" fill="#334155">v1 LLM 평가</text>
  <rect x="1098" y="950" width="16" height="16" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="1124" y="963" font-size="12" fill="#334155">v2 결정론 평가</text>
  <rect x="1300" y="950" width="16" height="16" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1326" y="963" font-size="12" fill="#334155">AG-UI 챗봇</text>
  <rect x="1098" y="976" width="16" height="16" rx="3" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1124" y="989" font-size="12" fill="#334155">데이터 · 산출물</text>
  <rect x="1300" y="976" width="16" height="16" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="1326" y="989" font-size="12" fill="#334155">외부 Azure · ID</text>

  <!-- Arrows -->
  <path d="M530,222 L530,248" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <text x="542" y="242" font-size="11" fill="#475569">HTTPS 443</text>

  <path d="M530,322 L530,348" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <text x="542" y="342" font-size="11" fill="#475569">/api/* 프록시</text>

  <path d="M224,572 L224,598" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M530,572 L530,598" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M836,572 L836,598" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>

  <path d="M224,830 L224,856" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M530,830 L530,856" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M836,830 L836,856" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>

  <path d="M1000,166 L1076,166" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
