  <path d="M1000,412 L1076,412" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <text x="1038" y="404" font-size="11" fill="#475569" text-anchor="middle">ARM 조회</text>

  <path d="M1000,640 L1076,640" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <text x="1038" y="632" font-size="11" fill="#475569" text-anchor="middle">evidence</text>

  <path d="M1000,760 L1076,760" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <text x="1038" y="752" font-size="11" fill="#475569" text-anchor="middle">LLM 호출</text>

  <path d="M1350,222 L1350,286 L1030,286 L1030,382 L1004,382"
