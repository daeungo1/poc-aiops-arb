<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 960" width="1480" height="960"
     font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>AIOps ARB — Azure 아키텍처</title>
  <desc>User Browser, Entra ID, VNet 내 App Service(프런트엔드/백엔드), Private Endpoint, ACR·AI Foundry·PostgreSQL, 평가 대상 Azure 리소스로 구성된 배포 아키텍처</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b7cc7"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>

  <rect x="0" y="0" width="1480" height="960" fill="#ffffff"/>

  <text x="60" y="52" font-size="27" font-weight="700" fill="#212529">AIOps ARB — Azure 아키텍처</text>
  <text x="60" y="80" font-size="14" fill="#868e96">App Service for Containers + Private Endpoint · 평가 경로는 v1(LLM) / v2(결정론) 두 갈래</text>

  <!-- User Browser -->
  <rect x="60" y="110" width="340" height="90" rx="10" fill="#bcdcf7" stroke="#2b7cc7" stroke-width="2"/>
  <text x="230" y="150" font-size="19" font-weight="600" fill="#12507f" text-anchor="middle">User Browser</text>
  <text x="230" y="175" font-size="12.5" fill="#1864ab" text-anchor="middle">React SPA · AG-UI 챗 사이드바</text>

  <!-- Entra ID -->
  <rect x="1000" y="110" width="420" height="90" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="1210" y="140" font-size="17" font-weight="700" fill="#a51111" text-anchor="middle">Microsoft Entra ID</text>
  <text x="1210" y="163" font-size="12.5" fill="#c92a2a" text-anchor="middle">SSO 앱 등록 + Workload Identity Federation</text>
  <text x="1210" y="184" font-size="12.5" fill="#c92a2a" text-anchor="middle">사용자 위임 토큰(OBO) 발급 · HttpOnly 쿠키</text>

  <!-- VNet -->
  <rect x="60" y="240" width="860" height="520" rx="8" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="898" y="268" font-size="14" font-weight="600" fill="#495057" text-anchor="end">Azure Virtual Network (10.0.0.0/16) + Private DNS Zones</text>

  <!-- Frontend App Service -->
  <rect x="100" y="300" width="780" height="90" rx="10" fill="#bcdcf7" stroke="#2b7cc7" stroke-width="2"/>
  <text x="490" y="330" font-size="17" font-weight="700" fill="#12507f" text-anchor="middle">Azure App Service — Frontend (Public)</text>
  <text x="490" y="354" font-size="12.5" fill="#1864ab" text-anchor="middle">nginx: React SPA 정적 서빙 + /api/* 리버스 프록시</text>
  <text x="490" y="375" font-size="12.5" fill="#1864ab" text-anchor="middle">Linux · Web App for Containers</text>

  <!-- Backend App Service -->
  <rect x="100" y="430" width="780" height="140" rx="10" fill="#b7e6bf" stroke="#2f9e44" stroke-width="2"/>
  <text x="490" y="458" font-size="17" font-weight="700" fill="#1a6b2a" text-anchor="middle">Azure App Service — Backend (Private)</text>
  <text x="490" y="480" font-size="12.5" fill="#2b8a3e" text-anchor="middle">FastAPI + Microsoft Agent Framework(AG-UI) · Managed Identity(System + User-Assigned)</text>

  <rect x="120" y="496" width="360" height="58" rx="8" fill="#ffffff" stroke="#e8a020" stroke-width="1.8"/>
  <text x="300" y="519" font-size="13" font-weight="700" fill="#a1670a" text-anchor="middle">v1 · backend/agent — LLM 평가</text>
  <text x="300" y="538" font-size="11.5" fill="#b8860b" text-anchor="middle">/api/assessments · 리포트 · Terraform 초안</text>

  <rect x="500" y="496" width="360" height="58" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.8"/>
  <text x="680" y="519" font-size="13" font-weight="700" fill="#5028c0" text-anchor="middle">v2 · backend/enterprise — 결정론 평가</text>
  <text x="680" y="538" font-size="11.5" fill="#6741d9" text-anchor="middle">/api/v2 · evidence 수집 → verdict (LLM 미개입)</text>

  <!-- Private Endpoint subnet -->
  <rect x="100" y="630" width="780" height="80" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
  <text x="490" y="660" font-size="16" font-weight="700" fill="#343a40" text-anchor="middle">Azure Private Link — Private Endpoint 서브넷</text>
  <text x="490" y="684" font-size="12.5" fill="#495057" text-anchor="middle">Backend · Container Registry · AI Foundry · PostgreSQL</text>

  <!-- PaaS row -->
  <rect x="60" y="810" width="270" height="120" rx="10" fill="#ffe08a" stroke="#e8a020" stroke-width="2"/>
  <text x="195" y="848" font-size="15" font-weight="700" fill="#8a5a00" text-anchor="middle">Azure Container Registry</text>
  <text x="195" y="872" font-size="12" fill="#a1670a" text-anchor="middle">Premium · Private Endpoint</text>
  <text x="195" y="894" font-size="12" fill="#a1670a" text-anchor="middle">백엔드 · 프런트엔드 이미지</text>

  <rect x="360" y="810" width="270" height="120" rx="10" fill="#ffe08a" stroke="#e8a020" stroke-width="2"/>
  <text x="495" y="848" font-size="15" font-weight="700" fill="#8a5a00" text-anchor="middle">Azure AI Foundry</text>
  <text x="495" y="872" font-size="12" fill="#a1670a" text-anchor="middle">Azure OpenAI · gpt-5.2</text>
  <text x="495" y="894" font-size="12" fill="#a1670a" text-anchor="middle">v1 평가 · 챗봇 · Terraform 초안</text>

  <rect x="660" y="810" width="270" height="120" rx="10" fill="#ffe08a" stroke="#e8a020" stroke-width="2"/>
  <text x="795" y="848" font-size="13.5" font-weight="700" fill="#8a5a00" text-anchor="middle">Azure Database for PostgreSQL</text>
  <text x="795" y="872" font-size="12" fill="#a1670a" text-anchor="middle">Flexible Server (Private)</text>
  <text x="795" y="894" font-size="12" fill="#a1670a" text-anchor="middle">체크리스트 · 평가 결과 · evidence</text>

  <!-- Assessment targets / evidence sources -->
  <rect x="980" y="420" width="440" height="160" rx="10" fill="#d0bfff" stroke="#7048e8" stroke-width="2"/>
  <text x="1000" y="452" font-size="16" font-weight="700" fill="#4a25b8">평가 대상 · Evidence 원천</text>
  <text x="1000" y="478" font-size="12.5" fill="#5028c0">Azure Resource Graph · ARM — 리소스 인벤토리</text>
  <text x="1000" y="500" font-size="12.5" fill="#5028c0">Azure Policy · Defender for Cloud · Advisor</text>
  <text x="1000" y="522" font-size="12.5" fill="#5028c0">APRL / ARG 쿼리</text>
  <text x="1000" y="550" font-size="11.5" fill="#a51111">v1: 사용자 위임(OBO) 으로 조회</text>
  <text x="1000" y="568" font-size="11.5" fill="#a51111">v2: 위 원천이 곧 결정론 판정의 근거</text>

  <!-- Legend -->
  <rect x="980" y="620" width="440" height="280" rx="10" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
  <text x="1000" y="650" font-size="15" font-weight="700" fill="#343a40">Legend</text>

  <rect x="1000" y="664" width="18" height="18" rx="4" fill="#bcdcf7" stroke="#2b7cc7" stroke-width="1.5"/>
  <text x="1030" y="678" font-size="13" fill="#343a40">공개 인바운드 (Browser · Frontend)</text>
  <rect x="1000" y="694" width="18" height="18" rx="4" fill="#b7e6bf" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="1030" y="708" font-size="13" fill="#343a40">컴퓨트 (App Service Backend)</text>
  <rect x="1000" y="724" width="18" height="18" rx="4" fill="#ffe08a" stroke="#e8a020" stroke-width="1.5"/>
  <text x="1030" y="738" font-size="13" fill="#343a40">PaaS 데이터 · AI</text>
  <rect x="1000" y="754" width="18" height="18" rx="4" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
  <text x="1030" y="768" font-size="13" fill="#343a40">ID · 인증 (Entra ID)</text>
  <rect x="1000" y="784" width="18" height="18" rx="4" fill="#d0bfff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="1030" y="798" font-size="13" fill="#343a40">평가 대상 · Evidence 원천</text>
  <rect x="1000" y="814" width="18" height="18" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1.5"/>
  <text x="1030" y="828" font-size="13" fill="#343a40">Private Link</text>

  <text x="1000" y="860" font-size="11.5" fill="#868e96">모든 PaaS 는 Private Endpoint 로만 접근 (public network access disabled)</text>
  <text x="1000" y="880" font-size="11.5" fill="#868e96">LLM 호출은 항상 백엔드 Managed Identity 로 수행</text>

  <!-- Arrows -->
  <path d="M400,155 L994,155" stroke="#e03131" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <text x="697" y="146" font-size="13" fill="#c92a2a" text-anchor="middle">SSO (OAuth2 / OIDC)</text>

  <path d="M230,200 L230,296" stroke="#2b7cc7" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <text x="244" y="255" font-size="13" fill="#1864ab">HTTPS 443</text>

  <path d="M490,390 L490,426" stroke="#2f9e44" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <text x="504" y="414" font-size="12.5" fill="#2b8a3e">/api/* 리버스 프록시</text>

  <path d="M880,445 L950,445 L950,182 L994,182" stroke="#e03131" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <text x="938" y="320" font-size="11.5" fill="#c92a2a" text-anchor="middle" transform="rotate(-90 938 320)">Workload Identity Federation</text>

  <path d="M880,500 L974,500" stroke="#7048e8" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>
  <text x="927" y="492" font-size="11.5" fill="#5028c0" text-anchor="middle">조회 · 수집</text>

  <path d="M490,570 L490,626" stroke="#868e96" stroke-width="2" fill="none" marker-end="url(#a-gray)"/>

  <path d="M250,710 L197,804" stroke="#2b7cc7" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <text x="130" y="772" font-size="12" fill="#1864ab">image pull</text>

  <path d="M490,710 L494,804" stroke="#e8590c" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>
  <text x="508" y="772" font-size="12" fill="#d9480f">LLM 추론</text>

  <path d="M730,710 L792,804" stroke="#c2255c" stroke-width="2" fill="none" marker-end="url(#a-gray)"/>
  <text x="800" y="772" font-size="12" fill="#a61e4d">DB 5432</text>
</svg>
